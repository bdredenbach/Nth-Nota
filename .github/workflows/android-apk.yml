name: Nth Nota Android preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'dist/**', 'tools/**', 'checks/**', 'package.json', '.github/workflows/android-apk.yml']
permissions:
  contents: read
concurrency:
  group: nota-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser and test libraries
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Prepare bundled editor libraries
        run: npm run prepare:vendor
      - name: Check JavaScript and recovery behavior
        run: |
          for file in dist/*.js; do node --check "$file"; done
          npm test
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reuse the preview signing key when available
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: nth-nota-preview-signing-v1
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build preview APK
        run: gradle -p android assembleDebug --no-daemon
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Nth-Nota-0.2.0.apk
          sha256sum artifacts/Nth-Nota-0.2.0.apk > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Nth-Nota-0.2.0-preview
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
