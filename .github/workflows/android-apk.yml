name: Nth Nota Android preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'dist/**', 'tools/**', 'checks/**', 'package.json', '.github/workflows/android-apk.yml']
permissions:
  contents: read
concurrency:
  group: nota-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser and test libraries
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Prepare bundled editor libraries
        run: npm run prepare:vendor
      - name: Check JavaScript and recovery behavior
        run: |
          for file in dist/*.js; do node --check "$file"; done
          npm test
      - name: Verify mobile and desktop UI in Chromium
        run: |
          npx playwright install chromium --with-deps
          node tools/ui-smoke.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reuse the preview signing key when available
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nota-signing/debug.keystore
          key: nth-nota-preview-signing-v2
      - name: Create the preview key if no cached copy exists
        env:
          NOTA_PREVIEW_KEYSTORE: ${{ runner.temp }}/nota-signing/debug.keystore
        run: |
          if [ ! -f "$NOTA_PREVIEW_KEYSTORE" ]; then
            mkdir -p "$(dirname "$NOTA_PREVIEW_KEYSTORE")"
            keytool -genkeypair -keystore "$NOTA_PREVIEW_KEYSTORE" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Nth Nota Preview,O=Nth Experience,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build preview APK
        env:
          NOTA_AI_GATEWAY_URL: ${{ vars.NOTA_AI_GATEWAY_URL }}
          NOTA_PREVIEW_KEYSTORE: ${{ runner.temp }}/nota-signing/debug.keystore
        run: |
          gradle -p android testDebugUnitTest assembleDebug --no-daemon
          mkdir -p artifacts/native-tests
          cp android/app/build/test-results/testDebugUnitTest/TEST-*.xml artifacts/native-tests/
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Nth-Nota-0.15.0.apk
          sha256sum artifacts/Nth-Nota-0.15.0.apk > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nth-Nota-0.15.0-preview
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
  release:
    needs: preview
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Require the matching web checks to pass
        shell: bash
        run: |
          set -euo pipefail
          passed=false
          for attempt in {1..60}; do
            status=$(gh api "repos/$GH_REPO/actions/workflows/pages.yml/runs?head_sha=$GITHUB_SHA&per_page=10" --jq '.workflow_runs[0] | (.status // "waiting") + ":" + (.conclusion // "")')
            if test "$status" = completed:success; then
              passed=true
              break
            fi
            case "$status" in completed:*) echo "Web checks did not pass: $status"; exit 1;; esac
            echo "Waiting for the matching web checks: $status"
            sleep 10
          done
          test "$passed" = true
      - name: Download the verified Android build
        uses: actions/download-artifact@v4
        with:
          name: Nth-Nota-0.15.0-preview
          path: release-build
      - name: Publish the verified APK
        shell: bash
        run: |
          set -euo pipefail
          tag=v0.15.0
          apk=Nth-Nota-0.15.0.apk
          read -r expected ignored < release-build/SHA256SUMS.txt
          test "${#expected}" = 64
          printf '%s  %s\n' "$expected" "release-build/$apk" | sha256sum --check --strict
          mkdir -p publish
          cp "release-build/$apk" publish/
          (cd publish && sha256sum "$apk" > SHA256SUMS.txt)
          cat > release-notes.md <<'NOTES'
          Android preview of Nth Nota 0.15.0.

          Download **Nth-Nota-0.15.0.apk** below to install or update the Android app.

          - Search Desk by a job or everyday term, and reopen recently used tools.
          - Link related items across canvases and make connected tasks from selected writing.
          - Shared writing controls and accurate tool names across the canvas and saved items.
          - Visible saving feedback, retry and backup recovery, and draft capture when leaving the app.

          [Open the web app for iPhone or desktop](https://bdredenbach.github.io/Nth-Nota/).
          NOTES
          printf '\nVerified build commit: %s. SHA256SUMS.txt contains the APK checksum.\n' "$GITHUB_SHA" >> release-notes.md
          if ! gh release view "$tag" > /dev/null 2>&1; then
            test "$(gh api "repos/$GH_REPO/branches/main" --jq .commit.sha)" = "$GITHUB_SHA"
            gh release create "$tag" --target "$GITHUB_SHA" --draft --prerelease --title 'Nth Nota 0.15.0 · Android preview' --notes-file release-notes.md
          fi
          if gh release download "$tag" --pattern "$apk" --dir existing-apk 2>/dev/null; then
            printf '%s  %s\n' "$expected" "existing-apk/$apk" | sha256sum --check --strict
          else
            gh release upload "$tag" "publish/$apk"
          fi
          if gh release download "$tag" --pattern SHA256SUMS.txt --dir existing-checksum 2>/dev/null; then
            cmp publish/SHA256SUMS.txt existing-checksum/SHA256SUMS.txt
          else
            gh release upload "$tag" publish/SHA256SUMS.txt
          fi
          gh release edit "$tag" --draft=false --prerelease --notes-file release-notes.md
          gh release view "$tag" --json url --jq .url
