name: Nth Nota Android preview
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', 'dist/**', 'tools/**', 'checks/**', 'package.json', '.github/workflows/android-apk.yml']
permissions:
  contents: read
concurrency:
  group: nota-android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned browser and test libraries
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Prepare bundled editor libraries
        run: npm run prepare:vendor
      - name: Check JavaScript and recovery behavior
        run: |
          for file in dist/*.js; do node --check "$file"; done
          npm test
      - name: Verify mobile and desktop UI in Chromium
        run: |
          npx playwright install chromium --with-deps
          node tools/ui-smoke.cjs
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reuse the preview signing key when available
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/nota-signing/debug.keystore
          key: nth-nota-preview-signing-v2
      - name: Create the preview key if no cached copy exists
        env:
          NOTA_PREVIEW_KEYSTORE: ${{ runner.temp }}/nota-signing/debug.keystore
        run: |
          if [ ! -f "$NOTA_PREVIEW_KEYSTORE" ]; then
            mkdir -p "$(dirname "$NOTA_PREVIEW_KEYSTORE")"
            keytool -genkeypair -keystore "$NOTA_PREVIEW_KEYSTORE" -storepass android -alias androiddebugkey -keypass android -dname 'CN=Nth Nota Preview,O=Nth Experience,C=US' -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build preview APK
        env:
          NOTA_AI_GATEWAY_URL: ${{ vars.NOTA_AI_GATEWAY_URL }}
          NOTA_PREVIEW_KEYSTORE: ${{ runner.temp }}/nota-signing/debug.keystore
        run: |
          gradle -p android testDebugUnitTest assembleDebug --no-daemon
          mkdir -p artifacts/native-tests
          cp android/app/build/test-results/testDebugUnitTest/TEST-*.xml artifacts/native-tests/
      - name: Verify APK signature
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs android/app/build/outputs/apk/debug/app-debug.apk
          mkdir -p artifacts
          cp android/app/build/outputs/apk/debug/app-debug.apk artifacts/Nth-Nota-0.13.1.apk
          sha256sum artifacts/Nth-Nota-0.13.1.apk > artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Nth-Nota-0.13.1-preview
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30
