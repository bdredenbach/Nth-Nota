plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
android {
    namespace 'com.nthexperience.nota'
    compileSdk 36
    defaultConfig {
        applicationId 'com.nthexperience.nota'
        minSdk 26
        targetSdk 36
        versionCode 21
        versionName '0.9.1'
        def gatewayDefaults = new Properties()
        rootProject.file('ai-gateway.properties').withInputStream { gatewayDefaults.load(it) }
        def gateway = System.getenv('NOTA_AI_GATEWAY_URL') ?: gatewayDefaults.getProperty('url', '')
        if (gateway && !(gateway ==~ /https:\/\/[a-z0-9][a-z0-9.-]+\/v1\/write/)) throw new GradleException('NOTA_AI_GATEWAY_URL must be an HTTPS /v1/write endpoint')
        buildConfigField 'String', 'AI_GATEWAY_URL', '"' + gateway + '"'
    }
    buildFeatures { buildConfig true }
    kotlinOptions { jvmTarget = "17" }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    signingConfigs { debug {
        def previewKey = System.getenv('NOTA_PREVIEW_KEYSTORE')
        if (previewKey) storeFile file(previewKey)
    } }
    buildTypes { debug { applicationIdSuffix '.preview' }; release { minifyEnabled false } }
}
// Bundle this checkout's complete editor. There is no remote website dependency.
def webAssets = layout.buildDirectory.dir('generated/notaAssets')
def bundleWeb = tasks.register('bundleWeb', Sync) {
    from(rootProject.projectDir.parentFile.toPath().resolve('dist'))
    into(webAssets.map { it.dir('www') })
}
android.sourceSets.main.assets.srcDir(webAssets)
tasks.named('preBuild').configure { dependsOn(bundleWeb) }

// Gemini Nano is executed by Android AICore, with no API key or cloud billing.
dependencies { testImplementation 'junit:junit:4.13.2'; testImplementation 'org.json:json:20240303'; implementation 'com.google.mlkit:genai-prompt:1.0.0-beta4' }

dependencies { implementation 'com.google.mlkit:genai-speech-recognition:1.0.0-alpha1'; implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.10.2' }

dependencies { implementation 'com.google.mlkit:digital-ink-recognition:19.0.0' }

dependencies { implementation 'com.google.mlkit:text-recognition:16.0.1' }
