plugins { id 'com.android.application' }
android {
    namespace 'com.nthexperience.nota'
    compileSdk 36
    defaultConfig {
        applicationId 'com.nthexperience.nota'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.3.0'
    }
    buildFeatures { buildConfig true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { debug { applicationIdSuffix '.preview' }; release { minifyEnabled false } }
}
// Bundle this checkout's complete editor. There is no remote website dependency.
def webAssets = layout.buildDirectory.dir('generated/notaAssets')
def bundleWeb = tasks.register('bundleWeb', Sync) {
    from(rootProject.projectDir.parentFile.toPath().resolve('dist'))
    into(webAssets.map { it.dir('www') })
}
android.sourceSets.main.assets.srcDir(webAssets)
tasks.named('preBuild').configure { dependsOn(bundleWeb) }

// Gemini Nano is executed by Android AICore, with no API key or cloud billing.
dependencies { implementation 'com.google.mlkit:genai-prompt:1.0.0-beta4' }
